name: Publicar en GitHub Pages

on:
  push:
    branches: [main, claude/wizardly-johnson-bsg6uo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Acciones fijadas por hash de commit (una etiqueta se puede mover; un hash no).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Falla si una dependencia que se publica tiene una vulnerabilidad alta o crítica conocida.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      # Tipo de cambio histórico público (BCRP). Si el BCRP no responde, reutiliza el ya publicado.
      - run: node scripts/tc-bcrp.mjs
        env:
          TC_PUBLICADO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/tc/usd.json
      - run: npm run build
        env:
          # ID de cliente OAuth de Google (público). Se define en
          # Settings → Secrets and variables → Actions → Variables.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.VITE_GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ vars.VITE_GOOGLE_APP_ID }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
